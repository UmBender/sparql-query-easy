# OPS-006: PostgreSQL, the Ktor backend and the Caddy web front end on one
# origin. EASYQUERY_HTTPS_MODE (OPS-008) chooses local HTTP, Caddy's own
# certificates or the university proxy; see .env.example.
# Runbook: tcc/07 - Operations/Docker Compose Stack.md.
name: easyquery

x-db-password: &db-password ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easyquery}
      POSTGRES_USER: ${POSTGRES_USER:-easyquery}
      POSTGRES_PASSWORD: *db-password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    image: easyquery-backend:local
    environment:
      EASYQUERY_ENVIRONMENT: ${EASYQUERY_ENVIRONMENT:-production}
      EASYQUERY_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-easyquery}
      EASYQUERY_DB_USER: ${POSTGRES_USER:-easyquery}
      EASYQUERY_DB_PASSWORD: *db-password
      EASYQUERY_EXTREME_RESULT_LIMIT: ${EASYQUERY_EXTREME_RESULT_LIMIT:-100}
      EASYQUERY_AUTH_ATTEMPTS_PER_MINUTE: ${EASYQUERY_AUTH_ATTEMPTS_PER_MINUTE:-10}
      # Only Caddy reaches the backend, so X-Forwarded-For names the client.
      EASYQUERY_TRUST_PROXY: "true"
      # AUTH-005: comma-separated usernames with the admin role; empty means no admin.
      EASYQUERY_ADMIN_USERNAMES: ${EASYQUERY_ADMIN_USERNAMES:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  # OPS-009: pg_dump on BACKUP_SCHEDULE into BACKUP_DIR (a host path, so
  # `docker compose down -v` never deletes it), retention 7 daily + 4 weekly,
  # age-encrypted copies in BACKUP_OFFSITE_DIR when BACKUP_AGE_RECIPIENT is set.
  # Restore: scripts/restore-backup.sh. `:z` lets SELinux hosts write there.
  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    image: easyquery-backup:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easyquery}
      POSTGRES_USER: ${POSTGRES_USER:-easyquery}
      PGPASSWORD: *db-password
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-17 2 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:z
      - ${BACKUP_OFFSITE_DIR:-./backups/offsite}:/offsite:z
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: easyquery-web:local
    # OPS-008: local (deploy/Caddyfile), auto or proxy (deploy/caddy/).
    command: ["caddy", "run", "--config", "/etc/caddy/${EASYQUERY_HTTPS_MODE:-local}.Caddyfile", "--adapter", "caddyfile"]
    # Unset, these defaults make Caddy refuse to start in the mode that needs
    # them, with the variable's name in the error.
    environment:
      EASYQUERY_DOMAIN: ${EASYQUERY_DOMAIN:-required:EASYQUERY_DOMAIN-in-auto-mode}
      EASYQUERY_TLS: ${EASYQUERY_TLS:-EASYQUERY_TLS-is-required-in-auto-mode}
      EASYQUERY_TRUSTED_PROXIES: ${EASYQUERY_TRUSTED_PROXIES:-EASYQUERY_TRUSTED_PROXIES-is-required-in-proxy-mode}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
      # HTTPS for mode auto; without WEB_HTTPS_PORT Docker picks a free
      # loopback port that nothing uses.
      - "${WEB_HTTPS_BIND:-127.0.0.1}:${WEB_HTTPS_PORT:-}:443"
    volumes:
      - caddy-data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  # OPS-008: certificates and ACME account of mode auto.
  caddy-data:
