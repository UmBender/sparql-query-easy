# All local gates of tcc/06 - Development/Operational Map.md (QUAL-007, FE-049).
# Tests only: no deploy, no secrets. Every suite is offline (QUAL-003); the
# Ktor-backed suites start the built distribution on a local port. PostgreSQL
# runs as postgres:17-alpine through Testcontainers on the runner's Docker
# (QUAL-011); each job pre-pulls it so a pull failure is reported on its own.
#
# When (DEC-016 Q2 A, QUAL-016): every job on pull requests, pushes to main,
# the nightly schedule and manual runs. A push to any other branch runs only
# the fast jobs (Kotlin with the OpenAPI contract, frontend check, lint and
# Vitest); the browser job is skipped there. The compose smoke (DEC-016 Q1 C,
# QUAL-017) runs only on pushes to main, the nightly schedule and manual runs.
name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly at 03:17 UTC, off the hour to avoid the scheduler's peak.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A nightly run never cancels a push run on main, nor the other way round.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Playwright configs that build Ktor use this path too.
  GRADLE_USER_HOME: /tmp/sparql-query-easy-gradle

jobs:
  kotlin:
    name: Kotlin (ktlint, detekt, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: /tmp/sparql-query-easy-gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Pull the test PostgreSQL image (QUAL-011)
        run: docker pull postgres:17-alpine
      - run: ./gradlew ktlintCheck detekt test --no-daemon
      # QUAL-016: each failed test (or ktlint/detekt finding) as an annotation on the run page.
      - name: Annotate Kotlin failures
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          found = 0
          for path in glob.glob('build/test-results/test/*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for problem in list(case.iter('failure')) + list(case.iter('error')):
                      text = (problem.get('message') or problem.text or '').strip().replace('\n', ' ')[:900]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
                      found += 1
          for path in glob.glob('build/reports/ktlint/**/*.txt', recursive=True) + glob.glob('build/reports/detekt/*.txt'):
              lines = [line.strip() for line in open(path, encoding='utf-8') if line.strip()]
              for line in lines[:20]:
                  print(f"::error title={path}::{line[:900]}")
                  found += 1
          if not found:
              print('::error title=Kotlin gate::no failed test or report line found; see the step log')
          EOF
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-reports
          path: build/reports/
          retention-days: 7

  frontend-fast:
    name: New frontend (check, lint, Vitest, contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # QUAL-018: the retired legacy page, jQuery and legacy CSS stay out of the repository.
      - name: Legacy-free check
        working-directory: .
        run: node --test scripts/check-legacy-free.test.mjs && node scripts/check-legacy-free.mjs
      # npm 10 reads this lockfile as out of sync (peer resolution); npm 11 installs it.
      - run: npx --yes npm@11 ci
      # Vitest browser mode (component tests) runs in Firefox.
      - run: npx playwright install --with-deps firefox
      - run: npm run check
      - run: npm run lint
      # Vitest server with domain coverage (includes the OpenAPI contract and fixture shapes), then components.
      - run: npm run test:coverage
      - run: npx vitest run --project client

  frontend-browser:
    name: New frontend (Playwright, screens, axe, stack)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: /tmp/sparql-query-easy-gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npx --yes npm@11 ci
      - run: npx playwright install --with-deps firefox
      # Build, then the offline Playwright suite: flows, canvas screenshots, axe on every main route.
      - run: npm run test:e2e
      # QUAL-014: full-page screenshots in the pinned Playwright image (same fonts as the baselines).
      - name: Pull the screenshot image
        if: ${{ !cancelled() }}
        run: docker pull "mcr.microsoft.com/playwright:v$(node -p "require('./package.json').devDependencies['@playwright/test']")-noble"
      - if: ${{ !cancelled() }}
        run: npm run test:screens
      - name: Pull the test PostgreSQL image (QUAL-011)
        if: ${{ !cancelled() }}
        run: docker pull postgres:17-alpine
      - if: ${{ !cancelled() }}
        run: npm run test:stack
      # QUAL-016: the HTML report of each Playwright suite (e2e, screens, stack) on every run.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: frontend/playwright-report/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright
          path: frontend/test-results/
          retention-days: 7

  compose-smoke:
    name: Compose stack through Caddy (smoke)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npx --yes npm@11 ci
      - run: npx playwright install --with-deps firefox
      # Builds the backend and web images, starts db, backend and web as the project easyquery-test, runs
      # tests-compose/ on 127.0.0.1:18097 and removes the project's containers and volumes.
      - run: npm run test:compose
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: compose-playwright-report
          path: frontend/playwright-report/compose/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-results
          path: frontend/test-results/compose/
          retention-days: 7
